<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Flask App{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --border: #e5e7eb;
      --error: #b00020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --border: #334155;
        --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    nav {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .brand { font-weight: 700; margin-right: auto; }
    nav a {
      color: var(--text);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
    }
    nav a:hover { background: var(--bg); }
    nav a.active { background: var(--accent); color: var(--accent-text); }
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin-top: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .error { color: var(--error); font-weight: 600; }
    .muted, small { color: var(--muted); }
    .button, button {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-text);
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }
    .button:hover, button:hover { opacity: 0.9; }
    .button + a { margin-left: 12px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); }
    .entry-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .entry p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    footer { text-align: center; color: var(--muted); padding: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="brand">My Flask App</span>
      <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
      <a href="/about" {% if request.path == '/about' %}class="active"{% endif %}>About</a>
      <a href="/form" {% if request.path == '/form' %}class="active"{% endif %}>Form</a>
      <a href="/guestbook" {% if request.path == '/guestbook' %}class="active"{% endif %}>Guestbook</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Made with Flask 🐍</footer>
</body>
        </html>
